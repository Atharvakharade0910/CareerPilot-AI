name: CareerPilot CI
on: [push, pull_request]
permissions:
  contents: read

concurrency:
  group: careerpilot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-shutdown:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify local shutdown preserves unrelated processes
        shell: powershell
        run: ./tests/test_stop_local.ps1

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt
      - run: pip install pip-audit
      - run: python -m compileall -q backend/app
      - name: Test job matching, draft validation, and OCR resource cleanup
        env:
          PYTHONPATH: backend
        run: python -m pytest tests/test_matching.py tests/test_tailor_validation.py tests/test_ocr_cleanup.py -q
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: pip-audit -r backend/requirements.txt
