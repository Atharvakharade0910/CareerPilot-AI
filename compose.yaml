services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: careerpilot
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD privately}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - careerpilot_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
volumes:
  careerpilot_data:
